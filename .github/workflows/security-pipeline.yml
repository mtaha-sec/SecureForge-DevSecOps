name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # SAST - Semgrep
      # ==========================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config auto \
            application/juice-shop

      # ==========================
      # Secret Detection
      # ==========================

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      # ==========================
      # SCA - Trivy Filesystem
      # ==========================

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: application/juice-shop
          format: table

      # ==========================
      # Docker Build
      # ==========================

      - name: Build Docker Image
        run: |
          docker build \
          -t juice-shop:latest \
          -f docker/Dockerfile .



      # ==========================
      # Container Security
      # ==========================

      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: juice-shop:latest
          format: table
          severity: CRITICAL,HIGH
      # ==========================
      # SonarQube Cloud(no need for the url ;))
      # ==========================

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # ==========================
      # Start Juice Shop
      # ==========================

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop
      - name: Wait for Juice Shop
        run: |
          echo "Waiting for Juice Shop..."
          timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 5; done'
      - name: Test Application
        run: |
          curl -I http://localhost:3000
